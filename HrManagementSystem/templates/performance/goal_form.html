
{% extends "base.html" %}

{% block content %}
<div class="container py-3" style="max-width:900px">
  <a href="{% url 'performance:goal_list' %}" class="text-decoration-none">← Back to goals</a>
  <h2 class="fw-bold mt-3 mb-4">{{ page_title }}</h2>

  <form method="post" class="card border-0 shadow-sm rounded-4">
    {% csrf_token %}
    <div class="card-body p-4">
      {% if form.non_field_errors %}
      <div class="alert alert-danger">{{ form.non_field_errors }}</div>
      {% endif %}

      <div class="row g-3">
        {% for field in form %}
        <div class="{% if field.name == 'description' %}col-12{% else %}col-md-6{% endif %}">
          <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
          <div class="text-danger small">{{ error }}</div>
          {% endfor %}
        </div>
        {% endfor %}
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Save Goal</button>
        <a href="{% url 'performance:goal_list' %}" class="btn btn-light">Cancel</a>
      </div>
    </div>
  </form>
</div>

<style>
.container input, .container select, .container textarea {
  width:100%; padding:.65rem .75rem; border:1px solid #d1d5db;
  border-radius:.5rem; background:#fff;
}
</style>
{% endblock %}
