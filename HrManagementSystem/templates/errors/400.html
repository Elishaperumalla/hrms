{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>400 | Bad Request - HRMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{min-height:100vh;background:#f3f6fb;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827}
    .error-card{max-width:650px;width:100%;background:#fff;border:1px solid #e5eaf2;border-radius:24px;padding:clamp(28px,6vw,56px);box-shadow:0 18px 55px #0f172a0d}
    .error-code{font-size:clamp(4rem,12vw,7rem);line-height:1;font-weight:800;letter-spacing:-.06em;color:#2563eb}
    .error-icon{width:76px;height:76px;border-radius:22px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:2.2rem;margin:0 auto 22px}
    .brand{font-weight:750;letter-spacing:.02em;color:#111827}.muted{color:#64748b}
  </style>
</head>
<body>
  <main class="error-card text-center mx-3">
    <div class="brand mb-4">HRMS <span class="text-primary">●</span></div>
    <div class="error-icon" aria-hidden="true">!</div>
    <div class="error-code mb-3">400</div>
    <h1 class="h3 fw-bold mb-3">Bad request</h1>
    <p class="muted mb-4">The request could not be understood. Please check the information and try again.</p>
    <a class="btn btn-primary px-4 py-2 rounded-3" href="/">Go to Home</a>
    <p class="small muted mt-4 mb-0">Human Resource Management System</p>
  </main>
</body>
</html>
