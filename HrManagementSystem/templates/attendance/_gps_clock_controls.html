<form method="POST"
      action="{% url action_url %}"
      class="border rounded-3 p-3"
      data-gps-attendance-form
      data-face-verify-url="{% url 'attendance_face_verify' %}"
      data-face-action="{% if action_url == 'attendance_clock_in' %}clock-in{% else %}clock-out{% endif %}"
      data-face-exempt="{% if request.user.is_superuser or request.user.role == 'SUPER_ADMIN' %}true{% else %}false{% endif %}">
    {% csrf_token %}

    <label class="form-label fw-semibold">Choose attendance location</label>
    <div class="d-flex flex-wrap gap-3 mb-3">
        <label class="border rounded-3 p-3 flex-fill" style="cursor:pointer; min-width:130px;">
            <input class="form-check-input me-2" type="radio"
                   name="attendance_mode" value="OFFICE" required>
            <i class="bi bi-building me-1"></i>
            <span class="fw-semibold">Office</span>
            <div class="small text-muted mt-1">Must be within office radius</div>
        </label>
        <label class="border rounded-3 p-3 flex-fill" style="cursor:pointer; min-width:130px;">
            <input class="form-check-input me-2" type="radio"
                   name="attendance_mode" value="OUTSIDE" required>
            <i class="bi bi-geo-alt me-1"></i>
            <span class="fw-semibold">Outside</span>
            <div class="small text-muted mt-1">GPS location will be recorded</div>
        </label>
    </div>

    <input type="hidden" name="latitude" value="">
    <input type="hidden" name="longitude" value="">
    <input type="hidden" name="accuracy" value="">
    <input type="hidden" name="address" value="">
    <input type="hidden" name="face_verification_id" value="">

    <div class="d-flex flex-wrap align-items-center gap-2">
        <button type="button" class="btn btn-outline-primary" data-gps-verify>
            <i class="bi bi-crosshair me-1"></i> Verify GPS Location
        </button>
    </div>

    <div class="mt-3" data-face-area hidden>
        <div class="fw-semibold mb-2">
            <i class="bi bi-person-bounding-box me-1"></i>
            Face Verification
        </div>

        <div class="d-flex flex-wrap gap-2 mb-2">
            <button type="button" class="btn btn-outline-secondary" data-camera-start disabled>
                <i class="bi bi-camera-video me-1"></i> Open Camera
            </button>
            <button type="button" class="btn btn-outline-primary" data-face-capture disabled>
                <i class="bi bi-camera me-1"></i> Capture & Verify Face
            </button>
        </div>

        <video data-face-video class="w-100 rounded-3 border"
               style="max-width:420px;display:none;"
               autoplay playsinline muted></video>
        <canvas data-face-canvas hidden></canvas>
        <div class="small text-muted mt-2">
            Keep only your face in the frame and use good lighting.
        </div>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn {{ button_class }}" data-gps-submit disabled>
            {% if action_label == "Clock Out" %}
                <i class="bi bi-box-arrow-right me-1"></i>
            {% else %}
                <i class="bi bi-box-arrow-in-right me-1"></i>
            {% endif %}
            {{ action_label }}
        </button>
    </div>

    <div class="small mt-3 text-muted" data-gps-status role="status" aria-live="polite">
        Select Office or Outside, then verify your current GPS location.
    </div>
</form>

<script>
(function () {
    const form = document.currentScript.previousElementSibling;
    if (!form || !form.matches('[data-gps-attendance-form]')) return;

    const gpsButton = form.querySelector('[data-gps-verify]');
    const submitButton = form.querySelector('[data-gps-submit]');
    const status = form.querySelector('[data-gps-status]');
    const modeInputs = Array.from(form.querySelectorAll('input[name="attendance_mode"]'));
    const latitudeInput = form.querySelector('[name="latitude"]');
    const longitudeInput = form.querySelector('[name="longitude"]');
    const accuracyInput = form.querySelector('[name="accuracy"]');
    const addressInput = form.querySelector('[name="address"]');
    const tokenInput = form.querySelector('[name="face_verification_id"]');
    const faceArea = form.querySelector('[data-face-area]');
    const cameraButton = form.querySelector('[data-camera-start]');
    const captureButton = form.querySelector('[data-face-capture]');
    const video = form.querySelector('[data-face-video]');
    const canvas = form.querySelector('[data-face-canvas]');
    const isFaceExempt = form.dataset.faceExempt === 'true';

    let gpsReady = false;
    let faceReady = false;
    let cameraStream = null;
    let busy = false;

    function selectedMode() {
        const checked = modeInputs.find(input => input.checked);
        return checked ? checked.value : '';
    }

    function showStatus(message, kind) {
        status.textContent = message;
        status.className = 'small mt-3 ' +
            (kind === 'error' ? 'text-danger' :
             kind === 'success' ? 'text-success' : 'text-muted');
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        video.srcObject = null;
        video.style.display = 'none';
        captureButton.disabled = true;
    }

    function resetVerification(message) {
        gpsReady = false;
        faceReady = false;
        submitButton.disabled = true;
        tokenInput.value = '';
        latitudeInput.value = '';
        longitudeInput.value = '';
        accuracyInput.value = '';
        addressInput.value = '';
        faceArea.hidden = true;
        cameraButton.disabled = true;
        stopCamera();
        showStatus(message, 'normal');
    }

    modeInputs.forEach(input => {
        input.addEventListener('change', () => {
            resetVerification('Location selection changed. Verify GPS again.');
        });
    });

    gpsButton.addEventListener('click', () => {
        if (!selectedMode()) {
            showStatus('Please select Office or Outside first.', 'error');
            return;
        }
        if (!navigator.geolocation) {
            showStatus('GPS is not supported by this browser.', 'error');
            return;
        }

        resetVerification('Getting your current GPS location…');
        gpsButton.disabled = true;

        navigator.geolocation.getCurrentPosition(position => {
            const coords = position.coords;

            if (!Number.isFinite(coords.latitude) ||
                !Number.isFinite(coords.longitude) ||
                !Number.isFinite(coords.accuracy) ||
                coords.accuracy > 100) {
                showStatus('GPS accuracy is too low. Move to an open area and retry.', 'error');
                gpsButton.disabled = false;
                return;
            }

            latitudeInput.value = coords.latitude.toFixed(7);
            longitudeInput.value = coords.longitude.toFixed(7);
            accuracyInput.value = String(coords.accuracy);
            addressInput.value = '';
            gpsReady = true;
            gpsButton.disabled = false;

            faceArea.hidden = false;
            cameraButton.disabled = false;
            showStatus(
                isFaceExempt
                    ? 'GPS captured. Super Admin does not need face matching; capture a photo for attendance.'
                    : 'GPS captured (' + Math.round(coords.accuracy) +
                      ' m accuracy). Open the camera and verify your face.',
                'success'
            );
        }, error => {
            const errors = {
                1: 'Location permission denied. Allow location access and retry.',
                2: 'Your location is unavailable. Check device location settings.',
                3: 'GPS request timed out. Please retry.'
            };
            showStatus(errors[error.code] || 'Could not verify GPS. Please retry.', 'error');
            gpsButton.disabled = false;
        }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });

    cameraButton.addEventListener('click', async () => {
        if (!gpsReady || busy) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showStatus('Camera access is not supported. Open this site using HTTPS and a supported browser.', 'error');
            return;
        }

        try {
            cameraButton.disabled = true;
            cameraStream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
            });
            video.srcObject = cameraStream;
            video.style.display = 'block';
            await video.play();
            captureButton.disabled = false;
            showStatus('Camera ready. Center your face and select Capture & Verify Face.', 'normal');
        } catch (error) {
            stopCamera();
            cameraButton.disabled = false;
            showStatus('Could not open the camera. Allow camera permission and retry.', 'error');
        }
    });

    captureButton.addEventListener('click', async () => {
        if (!gpsReady || !cameraStream || busy || video.videoWidth === 0) {
            showStatus('Verify GPS and open the camera before capturing.', 'error');
            return;
        }

        busy = true;
        captureButton.disabled = true;
        cameraButton.disabled = true;
        submitButton.disabled = true;
        tokenInput.value = '';
        faceReady = false;
        showStatus('Sending image for secure server-side face verification…', 'normal');

        try {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            const blob = await new Promise(resolve =>
                canvas.toBlob(resolve, 'image/jpeg', 0.88)
            );
            if (!blob) throw new Error('Could not capture the camera image.');

            const data = new FormData(form);
            data.set('action', form.dataset.faceAction);
            data.set('face_image', blob, 'attendance-face.jpg');

            const response = await fetch(form.dataset.faceVerifyUrl, {
                method: 'POST',
                body: data,
                credentials: 'same-origin',
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });

            const result = await response.json();
            if (!response.ok || !result.ok || !result.verification_id) {
                if (result.registration_url) {
                    showStatus(result.message + ' Please register your face first.', 'error');
                } else {
                    showStatus(result.message || 'Face verification failed. Please retry.', 'error');
                }
                return;
            }

            tokenInput.value = result.verification_id;
            faceReady = true;
            submitButton.disabled = false;
            showStatus(result.message || 'Face verified. You can now submit attendance.', 'success');
            stopCamera();
        } catch (error) {
            showStatus(error.message || 'Face verification failed. Please retry.', 'error');
        } finally {
            busy = false;
            captureButton.disabled = !cameraStream;
            cameraButton.disabled = !gpsReady;
        }
    });

    form.addEventListener('submit', event => {
        if (!gpsReady || !selectedMode() || !latitudeInput.value ||
            !longitudeInput.value || !accuracyInput.value || !faceReady ||
            !tokenInput.value) {
            event.preventDefault();
            showStatus('Complete GPS and face verification before continuing.', 'error');
        }
    });

    window.addEventListener('pagehide', stopCamera);
})();
</script>
